  .tab{padding:8px 12px;border:0;border-radius:6px;background:#555;color:#fff;cursor:pointer;}
  .tab.active{background:#ff9800;}
  .catsec h2{display:flex;align-items:center;gap:12px;justify-content:space-between;background:#fff;padding:10px 14px;margin:10px 0 0;border-radius:8px;}

  .catsec #table .row{display:flex;}
  .catsec #table .cell{flex:1 1 0;width:auto;}
  input.cell{box-sizing:border-box;text-align:center;border:1px solid #ccc;border-radius:4px;padding:4px;background:#fff;}
  textarea.news{width:96%;min-height:60px;margin:6px 2%;display:block;padding:8px;box-sizing:border-box;}
  .tokbox{display:flex;align-items:center;gap:4px;margin-left:auto;}
  .tokbox input{width:110px;padding:8px 10px;border:0;border-radius:14px;background:#555;color:#fff;}
  .tokbox input::placeholder{color:#bbb;}
  .tokbox button{padding:8px 10px;border:0;border-radius:6px;background:#555;color:#fff;cursor:pointer;}
  #saveTokenBtn{width:34px;}
  .statusbar{position:fixed;bottom:0;left:0;right:0;background:#222;color:#fff;padding:10px;text-align:center;font-size:14px;}
  details{margin-top:8px;}
  [hidden]{display:none!important;}
</style>
